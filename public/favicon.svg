<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="La Vita Per Te">
  <!--
    Favicon de l'association.

    Le logo complet ne se réduit pas : son personnage est blanc sur fond
    blanc — sa silhouette ne tient qu'à une ombre portée, invisible à 16 px —
    et la signature « la Vita perTe » devient illisible sous 64 px. On reprend
    donc l'élément graphique qui porte l'identité et survit à la réduction :
    le V rouge de « Vita », sur le rouge de marque inversé pour le contraste.
  -->
  <rect width="64" height="64" rx="14" fill="#E30613"/>
  <!-- V capital, tracé plein, aux proportions du logo. -->
  <path d="M15 17 h10.5 L32 39.5 L38.5 17 H49 L37.5 49 h-11 Z" fill="#fff"/>
</svg>
